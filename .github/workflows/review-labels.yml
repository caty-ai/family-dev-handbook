# 基本門番: 高リスク領域レビューゲート (review-labels) — caller
# reusable 正本: .github/workflows/reusable-review-labels.yml (workflow_call)
# stencil: templates/ci/review-labels.yml (他リポはバージョンタグ pin。タグ名は templates/ci/README.md を参照)

name: Risk Review Gate

on:
  pull_request:
    # 既定 types に labeled/unlabeled は含まれない。省くと「人間が承認しても再評価されない」
    # 「剥がしても緑が残る」の両不具合になるため明示する。
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: risk-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-review-gate:
    # ローカルパス参照 (pin なし): 同リポ内の呼び出しでバージョンタグを pin すると、この reusable を
    # 改訂する PR が古いタグの内容で自己検証されるデッドロックになる。
    uses: ./.github/workflows/reusable-review-labels.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
    with:
      risk_paths_billing: 'none'   # 課金・支出コードなし (#25 で明示宣言)
      risk_paths_outbound: 'none'  # 対外送信コードなし (#25 で明示宣言)
      risk_paths_gates: 'scripts/readme-check/**'  # vendored README 検査器 = 唯一の内容ゲートの実体 (#25/#28)
      risk_paths_auth: 'none'      # 認証コードなし (#31 v0.9.2 で明示宣言 — 検知ログの AUTH 常在警告は「auth コード無し」確認済みの記録)
