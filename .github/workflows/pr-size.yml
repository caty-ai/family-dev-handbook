# 基本門番③: PR サイズ上限 (既定 250 行・助言ゲート) — caller
# reusable 正本: .github/workflows/reusable-pr-size.yml (workflow_call)
# stencil: templates/ci/pr-size.yml (他リポはバージョンタグ pin。タグ名は templates/ci/README.md を参照)

name: PR Size

on:
  pull_request:
    # 既定 types に labeled/unlabeled は含まれない。省くと「免除ラベルを貼っても再評価されない」
    # 「剥がしても緑が残る」の両不具合になるため明示する。edited は PR 本文の
    # 「## リファクタ宣言」追記を超過メッセージへ反映するため。
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size:
    # ローカルパス参照 (pin なし): 同リポ内の呼び出しでバージョンタグを pin すると、この reusable を
    # 改訂する PR が古いタグの内容で自己検証されるデッドロックになる。
    uses: ./.github/workflows/reusable-pr-size.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      max_lines: '250'
      # scripts/readme-check/** = readme-craft skill 正本からのバイト同一 vendoring (#25) —
      # レビュー対象は同一性であって行数ではない。exclude_patterns の値は 1行1パターンの
      # 生パターンのみ (# コメント行は reusable 側で解釈されず、そのままパターンとして扱われる
      # ため書かない)。
      exclude_patterns: 'scripts/readme-check/**'
