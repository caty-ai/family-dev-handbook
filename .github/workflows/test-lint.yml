# 基本門番①: テスト + lint — caller
# reusable 正本: .github/workflows/reusable-test-lint.yml (workflow_call)
# stencil: templates/ci/test-lint.yml (他リポはバージョンタグ pin。タグ名は templates/ci/README.md を参照)

name: Test + Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-lint:
    # ローカルパス参照 (pin なし): 同リポ内の呼び出しでバージョンタグを pin すると、この reusable を
    # 改訂する PR が古いタグの内容で自己検証されるデッドロックになる。
    uses: ./.github/workflows/reusable-test-lint.yml
    permissions:
      contents: read
    with:
      run_macos: true
      # T-6 (docs/10, #81) adoption-completion.
      require_suite_reconciliation: true
