# Adapted from NousResearch/hermes-agent (MIT)
# Source: https://github.com/NousResearch/hermes-agent/blob/main/.github/workflows/review-labels.yml
# Retrieved: 2026-08-09 / Changes: standalone 化 (workflow_call → pull_request)・検知を本ファイル内に統合・
#   emit_review_status.py 依存を外しインライン生成に統一・ラベル語彙と承認判定を家庭版に翻案。
#   2026-08-19: handbook#80 で workflow_call の reusable 正本へ再変換 (pull_request → workflow_call)。
#   高リスクパスのカテゴリ宣言 (RISK_PATHS_BILLING/OUTBOUND/GATES/AUTH) を caller の with: 入力へ移動。
#
# 守るもの: 高リスク領域 (enforcement/権限境界・認証・課金・不可逆操作・対外送信) に触れる PR が、
#           人間 (オーナー) の確認ラベルなしに merge されないこと。検知は機械・判定は人間。
#
# ⚠ このゲートの現時点の位置づけ = 「オーナー確認の可視化・監査記録」装置 (FP-5: 装わない):
#   赤止めと最新の risk-reviewed 貼付 actor の base 側名簿照合は機械化済み。ただし家族運用では
#   全エージェントがオーナーの資格情報を共有するため、actor 識別の強さは資格情報の分離の強さに限られる。
#   この照合が完全に実効化するのは identity 分離 (エージェント別 author/token) 後であり、無断貼付は
#   引き続きプロトコル違反 (handbook E-5「無承認チェックポイント実行の禁止」) として timeline で追及する。
#
# 設計姿勢 (handbook docs/05・docs/06・docs/09):
# - 高リスク領域の定義の正本は handbook docs/06 (再定義しない)。本ファイルはパスへの写像だけを持つ。
# - 承認は「貼り手」と「head SHA」の両方に束縛する。既定 = 方式1: ゲート自身のイベント判定 —
#   作者が単独で起こせるイベント (synchronize / reopened / ready_for_review) の run では承認ラベルを
#   無効として赤にし、緑に戻せるのは triage 権限者しか起こせないイベント (labeled / unlabeled) だけにする。
#   緑候補では方式2の貼り手条件 (b) (API 応答順でなく created_at 基準の最新 action が名簿内 actor の labeled で、後続 unlabeled なし) を完全に機械照合する。
#   ラベルの機械剥がし (「剥がしは機械・貼るのは人間」) は
#   可視化のための衛生で、判定はその成否に依存しない。
# - 確認者名簿は base (main) 側の .github/risk-reviewers.txt から読む。PR head から読んではならない —
#   「PR が名簿に自分を足して自分で通す」循環が開く。名簿不在・空・プレースホルダ = 赤。
# - ゲート判定は read 権限で完結し fork でも必ず赤/緑を出す。ラベル付与・剥がしの書き込みは
#   fork では 403 になるため警告に留める (fail-open・ゲート判定には影響させない)。
# - pull_request_target は使わない (untrusted コードに write トークンを渡す典型的脆弱形)。
# - risk_paths_* 入力は宣言必須・fail-closed のカテゴリ入力であって pr-size の exclude_patterns
#   とは性質が違う: review-labels は security gate なので、caller が __DECLARE_ME__ のまま渡す
#   (=宣言しない) と本ファイル側のプレースホルダ検査が赤にする。caller は「除外」で高リスク面を
#   隠すことはできない — none という明示宣言でしか高リスクなしを主張できず、AUTH は none でも
#   HEAD 自己検証 (**/auth/** の実マッチ) で警告が出る。
# 型の正本: caty-ai/family-dev-handbook .github/workflows/reusable-review-labels.yml
#           (他リポからのバージョンタグ pin 名は templates/ci/README.md を参照)

on:
  workflow_call:
    inputs:
      risk_paths_billing:
        description: "課金・支出領域のリポ固有パス (1行1パターン)。該当なしは 'none' を明示宣言。既定は __DECLARE_ME__ = 未宣言 = 赤。"
        type: string
        default: '__DECLARE_ME__'
      risk_paths_outbound:
        description: "対外公開・対人送信領域のリポ固有パス (1行1パターン)。該当なしは 'none' を明示宣言。既定は __DECLARE_ME__ = 未宣言 = 赤。"
        type: string
        default: '__DECLARE_ME__'
      risk_paths_gates:
        description: "門番の実体 (test/lint が呼ぶリポ固有スクリプト・設定) のパス (1行1パターン)。該当なしは 'none' を明示宣言。既定は __DECLARE_ME__ = 未宣言 = 赤。"
        type: string
        default: '__DECLARE_ME__'
      risk_paths_auth:
        description: "認証・権限境界領域のリポ固有パス (1行1パターン)。該当なしは 'none' を明示宣言。既定は __DECLARE_ME__ = 未宣言 = 赤。"
        type: string
        default: '__DECLARE_ME__'

jobs:
  # ── 検知 (read-only): 高リスクパスに触れたかを判定する ─────────────────────────
  detect:
    name: detect-risk-paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      risk_hit: ${{ steps.match.outputs.risk_hit }}
      risk_files: ${{ steps.match.outputs.risk_files }}
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # 浅い checkout は「diff 解決不能 → 変更ゼロ扱い → 緑」の fail-open になる
          persist-credentials: false

      - id: match
        name: Match changed files against risk paths
        env:
          BASE_REF: ${{ github.base_ref }}
          # 文字クラス ([[:space:]])・tr・sed を決定論にする。LC_ALL=C だと全角空白 (U+3000)
          # が空白と分類されず、行内空白の赤検査をすり抜けて 0 マッチの静かな緑になる (実測)。
          # LANG でなく LC_ALL を pin する — LC_ALL は全 LC_* と LANG に優先し、runner 側の
          # export に上書きされない (R3 3席収束)。
          LC_ALL: C.UTF-8
          RISK_PATHS_BILLING_IN: ${{ inputs.risk_paths_billing }}
          RISK_PATHS_OUTBOUND_IN: ${{ inputs.risk_paths_outbound }}
          RISK_PATHS_GATES_IN: ${{ inputs.risk_paths_gates }}
          RISK_PATHS_AUTH_IN: ${{ inputs.risk_paths_auth }}
        run: |
          set -euo pipefail
          # 高リスク領域のパス写像 (定義の正本は handbook docs/06 — ここは写像だけ)。
          # パターンは git pathspec :(glob) 意味論・大文字小文字非依存で照合する
          # (名前でなく本質でマッチさせる — Migrations/ を取り逃さない)。
          RISK_PATHS_DEFAULT='
            .github/workflows/**
            .github/actions/**
            .github/risk-reviewers.txt
            .gitleaks.toml
            gitleaks.toml
            .gitleaksignore
            **/.gitleaksignore
            **/.env*
            **/*secret*
            **/auth/**
            **/migrations/**
            **/*migration*
            Makefile
            **/Makefile
            scripts/ci/**
          '
          # Makefile / scripts/ci/** = 門番のコマンド定義面。test-lint.yml が呼ぶ実体を
          # 1ファイル PR で無力化する経路 (make test を true 化等) を人間確認の対象に入れる
          # (handbook#28・icase 照合なので makefile 等の大小変種も **/Makefile が拾う)。
          # CUSTOMIZE (宣言必須・カテゴリ別・caller の with: ブロックで渡す): このリポ固有の
          # パスをカテゴリごとに列挙する。パターンは 1行1パターンの改行区切り — 空白区切りで
          # 1行に並べると「空白を含む1つの pathspec」として 0 ファイルにマッチする静かな
          # fail-open になるため、行内空白は下の検査で赤にする (空白を含む実パスは glob の ? で
          # 表す)。該当が無いカテゴリは none とだけ明示宣言する (受理する語は none のみ・
          # 大小文字不問。n/a 等の同義語は不可)。どれか一つでも __DECLARE_ME__ のまま
          # (宣言なし) なら赤 — 「書き忘れたカテゴリだけ静かに fail-open」をカテゴリ単位で
          # 許さない (fail-closed)。各入力の既定値は __DECLARE_ME__ — 宣言しない caller は
          # 必ず赤になる (未宣言をゼロ件マッチの none と誤認させない)。
          RISK_PATHS_BILLING="${RISK_PATHS_BILLING_IN}"
          RISK_PATHS_OUTBOUND="${RISK_PATHS_OUTBOUND_IN}"
          RISK_PATHS_GATES="${RISK_PATHS_GATES_IN}"
          # AUTH が DEFAULT に **/auth/** を持ちながら常設カテゴリでもある理由 (#31): その glob は
          # 「認証コードは auth/ ディレクトリにある」という配置前提で、フラット配置 (app/auth.py・
          # app/apple_signin.py 等) のリポでは 0 ファイルにマッチし、認証高リスク面がまるごと網外に
          # なる。配置前提を型に埋めず、リポごとの明示宣言 (fail-closed) に乗せる。
          # 認証コードが auth/ ディレクトリ配下に集約済み (DEFAULT の **/auth/** が実ファイルを
          # 拾う) なら none。複数パターンの宣言形 (1行1パターン) は caller の with: で:
          #   risk_paths_auth: |
          #     app/auth*.py
          #     **/token*.py
          RISK_PATHS_AUTH="${RISK_PATHS_AUTH_IN}"

          RISK_PATHS_REPO=''
          check_category() {
            NAME="$1"; VAL="$2"
            STRIPPED="$(echo "${VAL}" | tr -d '[:space:]')"
            # none / プレースホルダの照合は小文字化してから — 'None' 等の表記ゆれを厳密比較で
            # 取り逃すと「0ファイルにマッチする死にパターン」として黙って素通りする (#32)。
            FOLDED="$(echo "${STRIPPED}" | tr '[:upper:]' '[:lower:]')"
            # 空文字・空白のみも「宣言なし」— none という明示宣言か、実パスのどちらかを必須にする。
            if [ -z "$STRIPPED" ] || [ "$FOLDED" = "__declare_me__" ]; then
              echo "::error::${NAME} is empty or still the placeholder. Declare paths for this category, or declare 'none' explicitly — an undeclared category must not silently pass (fail-closed)."
              exit 1
            fi
            if [ "$FOLDED" = "none" ]; then
              # AUTH の none は「auth コードが無い」か「DEFAULT の **/auth/** が実カバーしている」
              # という主張。フラット配置の auth コードを持つリポが none と書くと警告ゼロで網外に
              # なる (#31 の残余) — 主張を HEAD で自己検証する (LC-5: 検知→警告・赤にしない)。
              if [ "$NAME" = "RISK_PATHS_AUTH" ]; then
                AUTH_FILES=$(git ls-files -- ':(glob,icase)**/auth/**') || AUTH_FILES=""
                if [ -z "$AUTH_FILES" ]; then
                  echo "::warning::RISK_PATHS_AUTH is 'none' but DEFAULT's **/auth/** matches 0 tracked files — if this repo has flat-layout auth code (e.g. app/auth.py), the auth surface is entirely uncovered (#31). Verify the 'none' claim or declare real paths."
                fi
              fi
              return 0
            fi
            # 行単位の健全性検査 (3席レビュー収束・#33):
            # - 行内空白 = 空白区切りの複数パターン誤記。git pathspec では空白が literal 文字の
            #   1パターンになり 0 件マッチ=静かな fail-open になるため赤。
            # - declare_me を含む行 = プレースホルダの残骸・打ち間違い (__DECLARE_ME_ 等)。
            #   実パスと混在した部分宣言も赤 (「宣言なしは赤」の契約を行単位でも守る)。
            while IFS= read -r line; do
              line="$(echo "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$line" ] || continue
              case "$line" in
                '#'*)
                  # コメント行は宣言の中では未対応 — 空白の有無で挙動が割れる (空白ありは
                  # 空白検査・空白なしは死にパターン化) のを許さず、正しい理由で赤にする。
                  echo "::error::${NAME} contains a comment line ('${line}') — comments are not supported inside category declarations; remove it (fail-closed)."
                  exit 1
                  ;;
                *[[:space:]]*)
                  echo "::error::${NAME} line '${line}' contains internal whitespace — declare one pattern per line (a space-separated list becomes ONE literal-space pathspec matching 0 files = silent fail-open). Use glob ? for a path that really contains a space."
                  exit 1
                  ;;
              esac
              # プレースホルダ検査は / も . も含まない行だけに掛ける — 実パターンは区切りか
              # 拡張子を持つ (app/declare_member.py 等の実在パスを誤って赤にしない)。
              case "$line" in
                */*|*.*) : ;;
                *)
                  LINE_FOLDED="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
                  case "$LINE_FOLDED" in
                    *declare_me*)
                      echo "::error::${NAME} contains a placeholder-like line ('${line}') — remove it and declare real paths or 'none' (fail-closed)."
                      exit 1
                      ;;
                  esac
                  ;;
              esac
            done <<< "${VAL}"
            RISK_PATHS_REPO="${RISK_PATHS_REPO}${VAL}"$'\n'
          }
          check_category RISK_PATHS_BILLING "$RISK_PATHS_BILLING"
          check_category RISK_PATHS_OUTBOUND "$RISK_PATHS_OUTBOUND"
          check_category RISK_PATHS_GATES "$RISK_PATHS_GATES"
          check_category RISK_PATHS_AUTH "$RISK_PATHS_AUTH"

          # 死にパターン検知 (LC-5: 検知→警告・自動では赤にしない): 宣言パターンが HEAD の
          # 1ファイルにも解決しない場合、リネーム・配置変更で写像が乖離した兆候 — 「存在しない
          # 敵を守れているように見える」まさに #31 の形。ログの警告で人間の判断に回す。
          # 展開手順の機械確認にはこのログの ::warning:: 確認を含める (README 手順 6)。
          while IFS= read -r pat; do
            pat="$(echo "$pat" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$pat" ] || continue
            # stderr は空判定に混ぜない — 成功時の stderr が「0マッチなのに生きて見える」形で
            # 死にパターン警告を黙らせる経路を作らない (エラー詳細は失敗時に再実行で表示)。
            if RESOLVED=$(git ls-files -- ":(glob,icase)${pat}" 2>/dev/null); then
              if [ -z "$RESOLVED" ]; then
                echo "::warning::declared risk pattern '${pat}' matches 0 tracked files at HEAD — possible dead pattern. Update the category declaration (a stale mapping silently uncovers the area)."
              fi
            else
              # 解決失敗は「死にパターン」でなく構文不正 — 誤診しない (診断を分ける)。
              # この後の diff 照合ループが同じパターンで fail-closed に落とす。
              git ls-files -- ":(glob,icase)${pat}" 2>&1 >/dev/null | sed 's/^/  /' || true
              echo "::warning::declared risk pattern '${pat}' could not be resolved as a pathspec (git error above) — fix the declaration syntax; the diff-matching step will fail closed on it."
            fi
          done <<< "${RISK_PATHS_REPO}"

          git rev-parse --verify "origin/${BASE_REF}" >/dev/null || {
            echo "::error::base ref not found — failing closed (FP-6)."; exit 1; }
          BASE=$(git merge-base "origin/${BASE_REF}" HEAD) || {
            echo "::error::merge-base failed — failing closed (FP-6)."; exit 1; }
          [ -n "$BASE" ] || { echo "::error::empty merge-base — failing closed."; exit 1; }

          ALL_PATTERNS="${RISK_PATHS_DEFAULT}
          ${RISK_PATHS_REPO}"
          HITS=""
          while IFS= read -r pat; do
            pat="$(echo "$pat" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$pat" ] || continue
            MATCHED=$(git diff --name-only "${BASE}...HEAD" -- ":(glob,icase)${pat}" || {
              echo "::error::diff/pathspec resolution failed for pattern '${pat}' — failing closed (FP-6)." >&2; exit 1; })
            if [ -n "$MATCHED" ]; then
              HITS="${HITS}${MATCHED}"$'\n'
            fi
          done <<< "${ALL_PATTERNS}"

          HITS=$(printf '%s' "$HITS" | sort -u | sed '/^$/d')
          if [ -n "$HITS" ]; then
            echo "risk_hit=true" >> "$GITHUB_OUTPUT"
            {
              echo "risk_files<<EOF_FILES"
              echo "$HITS"
              echo "EOF_FILES"
            } >> "$GITHUB_OUTPUT"
            echo "high-risk paths touched:"
            echo "$HITS"
          else
            echo "risk_hit=false" >> "$GITHUB_OUTPUT"
            echo "risk_files=" >> "$GITHUB_OUTPUT"
            echo "no high-risk paths touched."
          fi

  # ── ゲート判定 (read-only・required に登録する本体) ────────────────────────────
  # ラベル付与ジョブに needs: 依存しない — 書き込みの失敗が判定を pending・不明にする経路を作らない。
  gate:
    name: risk-review-gate
    needs: detect
    # if: always() — detect が落ちた時に本ジョブが skipped になる経路を塞ぐ。
    # branch protection は skipped の required check を成功扱いするため、skipped = fail-open。
    # detect の失敗は下の明示チェックで本ジョブの赤として現れる (required 登録名で赤を出す)。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # 名簿を base (main) 側から読むため
          persist-credentials: false

      - name: Evaluate gate
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tr・grep の文字分類を runner の locale に依存させず決定論にする。
          LC_ALL: C.UTF-8
          DETECT_RESULT: ${{ needs.detect.result }}
          EVENT_ACTION: ${{ github.event.action }}
          RISK_HIT: ${{ needs.detect.outputs.risk_hit }}
          RISK_FILES: ${{ needs.detect.outputs.risk_files }}
        run: |
          set -euo pipefail
          # detect が success 以外 (宣言忘れの赤・範囲解決失敗・キャンセル) なら本ジョブも赤 (fail-closed)。
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect job result is '${DETECT_RESULT}' — cannot judge risk paths, failing closed. See the detect-risk-paths job log (undeclared RISK_PATHS_REPO placeholder, unresolved diff range, etc.)."
            exit 1
          fi
          if [ "$RISK_HIT" != "true" ]; then
            echo "::notice::no high-risk paths touched — gate green."
            # 高リスク変更が無くても check は常に走って明示的な緑を出す (skipped の意味論に頼らない)。
            echo 'review_status=[]' > review-status.json
            exit 0
          fi

          # 確認者名簿: base (main) 側から読む。PR head から読まない (自己承認の循環封じ)。
          ROSTER=$(git show "origin/${BASE_REF}:.github/risk-reviewers.txt" 2>/dev/null) || {
            echo "::error::.github/risk-reviewers.txt not found on origin/${BASE_REF} — roster missing, failing closed. Copy templates/ci/risk-reviewers.txt.example and commit it on main."; exit 1; }
          ROSTER=$(printf '%s\n' "$ROSTER" | sed 's/#.*//' | sed 's/[[:space:]]//g' | sed '/^$/d')
          if [ -z "$ROSTER" ]; then
            echo "::error::risk reviewer roster is empty — failing closed."; exit 1;
          fi
          if grep -Fxq 'REPLACE_ME' <<<"$ROSTER"; then
            echo "::error::risk reviewer roster still contains the REPLACE_ME placeholder — failing closed."; exit 1;
          fi

          # 承認の head SHA 束縛はイベント種別で行う (剥がしジョブの成功に依存しない):
          # synchronize (新 push)・reopened (閉鎖中の push を挟みうる)・ready_for_review (draft⇄ready の
          # 往復は PR 作者が単独で起こせる) では、承認ラベルの有無にかかわらず赤 — 「新しい head /
          # 作者起点の再評価は未承認」。承認がラベル現在値で再評価されるのは labeled / unlabeled の run
          # (どちらも triage 権限者にしか起こせない) に限られる。ラベル剥がし (書き込み) が 403 になる
          # fork PR でも、作者単独の承認持ち回しは成立しない。
          if [ "$EVENT_ACTION" = "synchronize" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "ready_for_review" ]; then
            echo "::error::new head SHA (event: ${EVENT_ACTION}) — any previous risk-reviewed approval is void for this head. A human on the roster must re-review the diff and re-apply the label."
            echo ""
            echo "touched high-risk files:"
            printf '%s\n' "$RISK_FILES" | sed 's/^/  - /'
            STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk re-review required","summary":"The head changed; previous approval is void. Re-apply risk-reviewed for this head SHA.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the new diff and re-apply the risk-reviewed label."}]}]'
            echo "review_status=${STATUS}" > review-status.json
            exit 1
          fi

          # ラベル取得の失敗・空応答は赤 (FP-6: 判定不能 = 赤)。
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name') || {
            echo "::error::label fetch failed — cannot judge, failing closed (FP-6)."; exit 1; }

          # 方式1 (既定): risk-reviewed の現在有無で判定する (上のイベント束縛と対で機能する)。
          if grep -Fxq 'risk-reviewed' <<<"$LABELS"; then
            # API 不調を「貼り手不明のまま緑」へ変換しない (FP-6: 判定不能 = 赤)。
            # risk-reviewed の labeled/unlabeled を全ページから集め、created_at (+ 同秒の .id) で
            # 新旧を確定する。API 応答順という契約外依存を排除し、後続 unlabeled なしまで照合する (FP-6・方式2(b))。
            # matched event に created_at が無ければ順序判定不能として赤にする。
            # gh api は --slurp と --jq を併用できないため、slurp 後の [[...],[...]] をパイプ先の jq -r で一度だけ絞る。
            TIMELINE_DECISION=$(gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100" \
              | jq -r '[ .[][]
                | select((.event == "labeled" or .event == "unlabeled") and (.label.name // "") == "risk-reviewed") ]
              | if length == 0 then "NOEVENT"
                elif any(.[]; (.created_at // "") == "") then "AMBIGUOUS"
                else ( sort_by(.created_at, (.id // 0)) | last
                       | if .event != "labeled" then "UNLABELED_LATEST"
                         else "ACTOR\t" + (.actor.login // "") end )
                end') || {
              echo "::error::timeline fetch failed — cannot verify who applied risk-reviewed, failing closed (FP-6)."
              STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The risk-reviewed label actor could not be verified against the base-side roster.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
              echo "review_status=${STATUS}" > review-status.json
              exit 1
            }
            ACTOR_PREFIX=$(printf 'ACTOR\t')
            # GitHub login は tab を含まず '-' で始まらないため、ACTOR<tab> framing は login と衝突しない。
            case "$TIMELINE_DECISION" in
              NOEVENT)
                echo "::error::risk-reviewed is present but no labeled/unlabeled event for risk-reviewed was found in the full PR timeline — actor judgment is impossible, failing closed (FP-6)."
                STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The risk-reviewed label actor could not be verified against the base-side roster.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
                echo "review_status=${STATUS}" > review-status.json
                exit 1
                ;;
              AMBIGUOUS)
                echo "::error::risk-reviewed timeline event(s) are missing created_at — recency cannot be established, failing closed (FP-6)."
                STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The risk-reviewed label actor could not be verified against the base-side roster.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
                echo "review_status=${STATUS}" > review-status.json
                exit 1
                ;;
              UNLABELED_LATEST)
                echo "::error::the newest timeline action on risk-reviewed is a removal, which disagrees with the label-present snapshot — state judgment is impossible, failing closed (FP-6)."
                STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The PR timeline shows risk-reviewed was removed after its last apply; the label state could not be confirmed. Re-apply the label.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
                echo "review_status=${STATUS}" > review-status.json
                exit 1
                ;;
              "${ACTOR_PREFIX}"*)
                ACTOR=${TIMELINE_DECISION#"$ACTOR_PREFIX"}
                if [ -z "$ACTOR" ]; then
                  echo "::error::the most recent risk-reviewed apply has no recorded actor — actor judgment is impossible, failing closed (FP-6)."
                  STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The most recent risk-reviewed apply has no recorded actor.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
                  echo "review_status=${STATUS}" > review-status.json
                  exit 1
                fi
                ;;
              *)
                echo "::error::unrecognized risk-reviewed timeline decision — actor judgment is impossible, failing closed (FP-6)."
                STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"The risk-reviewed label actor could not be verified against the base-side roster.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
                echo "review_status=${STATUS}" > review-status.json
                exit 1
                ;;
            esac
            ACTOR_FOLDED=$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]')
            ROSTER_FOLDED=$(printf '%s\n' "$ROSTER" | tr '[:upper:]' '[:lower:]')
            if ! grep -Fxq -- "$ACTOR_FOLDED" <<<"$ROSTER_FOLDED"; then
              printf '%s\n' "::error::risk-reviewed was most recently applied by '${ACTOR}', who is not in the base-side roster — a roster human must review the diff and re-apply the label."
              STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk reviewer verification required","summary":"risk-reviewed was applied by an actor who is not in the base-side roster.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and re-apply the risk-reviewed label."}]}]'
              echo "review_status=${STATUS}" > review-status.json
              exit 1
            fi
            echo "::notice::risk-reviewed label present — gate green."
            echo "audit: approval is bound to the current head SHA at the gate itself (synchronize/reopened runs go red regardless of the label); the strip job additionally removes the stale label for visibility."
            printf '%s\n' "audit: risk-reviewed applied by '${ACTOR}' — verified against the base-side roster."
            echo "audit: roster (origin/${BASE_REF}:.github/risk-reviewers.txt):"
            printf '%s\n' "$ROSTER" | sed 's/^/  - /'
            STATUS='[{"source":"risk review","results":[]}]'
          else
            echo "::error::high-risk paths changed but the risk-reviewed label is not present — merge is blocked until a human on the roster reviews this head SHA and applies the label."
            echo ""
            echo "touched high-risk files:"
            printf '%s\n' "$RISK_FILES" | sed 's/^/  - /'
            echo ""
            echo "手順: 名簿 (.github/risk-reviewers.txt) にあるオーナーが、この head SHA の diff を確認してから"
            echo "      risk-reviewed ラベルを貼る。新しい push でラベルは自動で剥がれ、再確認が必要になる。"
            echo "注意: このゲートは現時点では可視化+監査 (誰がいつ貼ったかは PR timeline に残る)。"
            echo "      ラベルの無断貼付はプロトコル違反 (E-5) として扱われる。"
            STATUS='[{"source":"risk review","results":[{"kind":"action_required","title":"Risk review required","summary":"High-risk paths changed; a human on the roster must apply risk-reviewed for this head SHA.","detail":"","how_to_fix":"Ask an owner listed in .github/risk-reviewers.txt to review the diff and apply the risk-reviewed label."}]}]'
            echo "review_status=${STATUS}" > review-status.json
            exit 1
          fi
          echo "review_status=${STATUS}" > review-status.json

          # ── 方式2との hybrid ──────────────────────────────────────────
          # (a) は方式1のラベル現在有無、(b) は created_at 基準の最新 risk-reviewed event が
          # 名簿内 actor の labeled であること (後続 unlabeled なしを含む) まで完全実装済み。
          # (c) labeled-after-push 時刻照合は意図的に未実装。synchronize / reopened / ready_for_review は
          # イベント束縛で扱う一方、fork 403 で剥がせない古いラベルの既知残余は templates/ci/README.md に記載する。

      - name: Upload review status artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-risk-review
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

  # ── 書き込み系 (fail-open): 可視化ラベルの付与と、push 時の機械剥がし ─────────────
  # fork PR では 403 になるため警告に留める。ゲート判定はこのジョブの成否に依存しない。
  labels:
    name: apply-visibility-labels
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - name: Strip approval labels on new push (剥がしは機械・貼るのは人間)
        if: github.event.action == 'synchronize'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # if 条件内のパイプラインは errexit の対象外で API 失敗が黙って成功になる — 取得は明示代入で行う。
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name') || {
            echo "::warning::label fetch failed — skipping strip (hygiene only; gate judgment is unaffected)."; exit 0; }
          if grep -Fxq 'risk-reviewed' <<<"$LABELS"; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label 'risk-reviewed' \
              || echo "::warning::could not remove risk-reviewed (fork PR has no write token — 403 is expected there)."
            echo "risk-reviewed removed: approval is bound to the head SHA the owner saw; a new push requires re-review."
          fi

      - name: Apply needs-risk-review label (可視化専用・判定に影響しない)
        if: needs.detect.outputs.risk_hit == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'needs-risk-review' \
            || echo "::warning::could not add needs-risk-review (fork PR has no write token — 403 is expected there). Gate evaluation is unaffected."
