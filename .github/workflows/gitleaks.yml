# 基本門番②: secret 漏れ検知 (gitleaks) — caller
# reusable 正本: .github/workflows/reusable-gitleaks.yml (workflow_call)
# stencil: templates/ci/gitleaks.yml (他リポはバージョンタグ pin。タグ名は templates/ci/README.md を参照)

name: gitleaks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # ローカルパス参照 (pin なし): 同リポ内の呼び出しでバージョンタグを pin すると、この reusable を
    # 改訂する PR が古いタグの内容で自己検証されるデッドロックになる。
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read
