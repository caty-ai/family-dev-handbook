# 基本門番: 歴史切断 PR 検知 (history-check) — caller
# reusable 正本: .github/workflows/reusable-history-check.yml (workflow_call)
# stencil: templates/ci/history-check.yml (他リポはバージョンタグ pin。タグ名は templates/ci/README.md を参照)

name: History Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: history-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  history-check:
    # ローカルパス参照 (pin なし): 同リポ内の呼び出しでバージョンタグを pin すると、この reusable を
    # 改訂する PR が古いタグの内容で自己検証されるデッドロックになる。
    uses: ./.github/workflows/reusable-history-check.yml
    permissions:
      contents: read
