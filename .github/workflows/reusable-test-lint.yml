# 基本門番①: テスト + lint (reusable 正本)
#
# 守るもの: 「テストが通っていないコードが main に入らない」こと。
# 配り方: このファイルが正本 (workflow_call)。他リポの呼び出し側は
#         caty-ai/family-dev-handbook/.github/workflows/reusable-test-lint.yml をバージョンタグ
#         (タグ名は templates/ci/README.md「バージョニング」節を参照) 付きで `uses:` 参照する
#         (同リポ内の呼び出し元はローカルパスで参照する — このファイルを改訂する PR が
#         古いタグの内容で自己検証されるデッドロックを避けるため)。
#         スタンドアロン配布用のキャリアー stencil は templates/ci/ を参照。
#
# 設計姿勢 (handbook docs/05・docs/09 R-6):
# - 未設定 = 赤 (fail-closed)。「テストが無いリポでは green」にしない。
#   fail-open で置くと「置いただけで守られた気になる」(FP-5) ため、導入時に必ずコマンドを書かせる。
# - set -euo pipefail 必須・`|| true` でゲート判定を飲み込むこと禁止。
# - test は ubuntu と macOS の両方で走らせる (handbook #54)。開発機は全員 macOS で、
#   Linux 単独の CI は BSD/GNU のコマンド挙動差 (sed/grep/date/`--`/`\r`) を構造的に見逃すため。
#   private リポへ配る場合のみ: macOS 分は課金レート10倍のため、owner 判断で `run_macos: false` +
#   `macos_skip_reason` を caller の with: で渡すことで opt-down できる。理由が空のスキップは
#   赤にする (下記 test-macos-skip)。この型は素では test-macos / test-macos-skip のどちらか
#   一方が必ず走るため、「if だけ付けて常に skipped」という「置いただけ」の穴を型として作れない (FP-5)。
#   注意: workflow 単位で必須化する ruleset のリポでは、job 追加はそのまま必須チェックに加わる。
# 型の正本: caty-ai/family-dev-handbook .github/workflows/reusable-test-lint.yml
#           (他リポからのバージョンタグ pin 名は templates/ci/README.md を参照)
#
# 昇格した仕様 (issue #80 コメント 2026-08-19 オーナー決裁。起源は handbook#81 (T-6 clause, pending) が
# 語彙 `suites: declared=N executed=M skipped=K` の正本、および context-kit#12 / self-growth-loop#4 →
# オーナー決裁 2026-08-19 が2つの昇格の起源):
# - promotion ①: OS matrix の run_macos / macos_skip_reason (上記)。
# - promotion ②: ubuntu の test job で suite-count reconciliation (下記) を行う。
#
# 追加入力 (issue #101 / context-kit#52・すべて additive・未設定 = 従来どおり):
# - node_version: 指定時のみ actions/setup-node をテスト・lint の前に挿む。caller が push:main 側で
#   Node を pin しているのに PR 門番だけ runner 既定 Node で走る「検証マトリクスの割れ」を塞ぐ
#   (x-collector#43 3席収束)。未指定 = setup-node を挿まない (runner 既定 Node のまま)。
# - pre_test_setup_ubuntu / pre_test_setup_macos: テスト直前に走らせる OS 別のセットアップ shell
#   (apt/brew でテストが依存する OS パッケージを入れる等。例: Linux の xattr テストに `attr`)。
#   これは caller のリポが自分の CI に置くのと同じ信頼境界 (Makefile の test ターゲットと同じ) であり、
#   reusable の権限 (contents: read) を広げない。空 = ステップ自体を置かない。非空で失敗 = 赤 (set -e)。
#   Makefile 側で `apt-get` を叩く回避策を置くと macOS レグと乖離するため、OS 別入力として型に置く。

on:
  workflow_call:
    inputs:
      run_macos:
        description: "macOS matrix (test-macos) を走らせるか。false にする場合は macos_skip_reason 必須。"
        type: boolean
        default: true
      macos_skip_reason:
        description: "run_macos=false のときに必須の理由。空だと赤 (無言スキップ禁止・FP-5)。"
        type: string
        default: ''
      require_suite_reconciliation:
        description: "true の場合、T-6 の suite 突合行 (suites: declared=N executed=M skipped=K) が make test ログに無いと赤にする。"
        type: boolean
        default: false
      max_skip_percent:
        description: "T-6 (handbook#81) の declared=executed+skipped に許容する skipped の上限率。LC-3-style の caller-local/local-value として caller の with: で指定する。"
        type: string
        default: '20'
      node_version:
        description: "指定時のみ test / test-macos / lint の直前に actions/setup-node を挿む。受理形は数値 pin のみ (例: '20', '20.11', '22.x')。空白だけ・lts/* 等の浮動指定・.nvmrc は赤。リテラルで渡す (変数経由で空に潰れると未指定と区別できず runner 既定 Node で走る)。未指定 = runner 既定 Node のまま (従来どおり)。push:main 側で Node を pin している caller は同じ値をここに渡して検証マトリクスを揃える (issue #101)。"
        type: string
        default: ''
      pre_test_setup_ubuntu:
        description: "ubuntu の test job で make test の直前に走らせる shell (bash, set -euo pipefail)。テストが依存する OS パッケージの導入等 (例: sudo apt-get install -y attr)。空 = ステップを置かない。失敗 = 赤。"
        type: string
        default: ''
      pre_test_setup_macos:
        description: "macOS の test-macos job で make test の直前に走らせる shell (bash, set -euo pipefail)。例: brew install <pkg>。空 = ステップを置かない。失敗 = 赤。"
        type: string
        default: ''

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate node_version (only when node_version is set)
        # setup-node は空白だけの node-version を trim して「何も入れずに成功」する (v7.0.0 src/main.ts)。
        # その緑は #101 が塞ぎたい「runner 既定 Node で走る門番」そのものなので、ここで赤にする (FP-5)。
        # 受理形は数値 pin (例: 20 / 20.11 / 22.x) のみ — 'lts/*' 等の浮動指定は門番を再び浮かせるため不可。
        # 3 job に同じ2ステップが並ぶ (test / test-macos / lint) — 改訂時は3箇所すべてを揃えること。
        if: ${{ inputs.node_version != '' }}
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          TRIMMED=$(printf '%s' "$NODE_VERSION" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ]; then
            echo "::error::node_version is whitespace-only — setup-node would install nothing and the gate would silently run on the runner-default Node (fail-closed). Pass a literal like '20', or remove the input."
            exit 1
          fi
          if ! [[ "$TRIMMED" =~ ^[0-9]+(\.([0-9]+|x)){0,2}$ ]]; then
            echo "::error::node_version must be a numeric pin (e.g. '20', '20.11', '22.x'); received '${NODE_VERSION}'. Floating specs (lts/*, node, ranges, .nvmrc) are not accepted — they re-open the version drift this input exists to close."
            exit 1
          fi

      - name: Setup Node (only when node_version is set)
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          # この入力の役目は Node の pin だけ。setup-node v7 は package.json の packageManager を見て
          # 既定で npm cache を復元/保存する (package-manager-cache: true) — 門番の結果を宣言外の cache に
          # 依存させないため明示 off (Grok seat F3, 2026-09-04)。
          package-manager-cache: false

      - name: Pre-test setup (ubuntu, only when pre_test_setup_ubuntu is set)
        if: ${{ inputs.pre_test_setup_ubuntu != '' }}
        shell: bash
        env:
          PRE_TEST_SETUP: ${{ inputs.pre_test_setup_ubuntu }}
        run: |
          set -euo pipefail
          # 空白だけの入力は「置いただけ」の緑になるため赤にする (macos_skip_reason と同じ扱い・FP-5)。
          if [ -z "$(printf '%s' "$PRE_TEST_SETUP" | tr -d '[:space:]')" ]; then
            echo "::error::pre_test_setup_ubuntu is whitespace-only — a setup step that runs nothing must not pass silently (fail-closed). Remove the input or write the command."
            exit 1
          fi
          # 検証した値 (env) をそのまま実行する — run: へ二重に式展開しない (検証対象と実行対象を同一値に保つ・
          # ログ面への展開も避ける)。caller 自身の CI 定義 (Makefile の test ターゲット) と同じ信頼境界。
          # この入力に secrets を渡さないこと (reusable は secrets: を受けない設計・README 参照)。
          printf '%s\n' "$PRE_TEST_SETUP" > "$RUNNER_TEMP/pre-test-setup.sh"
          bash -euo pipefail "$RUNNER_TEMP/pre-test-setup.sh"

      - name: Run tests
        run: |
          set -euo pipefail
          # CUSTOMIZE: このリポのテストコマンドに差し替える (例: npm test / pytest / swift test)。
          # 既定は Makefile の `test` ターゲットを試み、無ければ「未設定」として赤で落ちる (fail-closed)。
          if [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test 2>&1 | tee /tmp/test-output.log
          else
            echo "::error::test command is not configured. Add a 'test:' target to this repo's Makefile (the gate runs 'make test') — an unconfigured gate must not pass (fail-closed by design)."
            exit 1
          fi

      - name: Suite-count reconciliation (T-6 promotion, issue #80 comment 2026-08-19)
        # 語彙の SoT: handbook#81 T-6 は `suites: declared=N executed=M skipped=K` と declared=executed+skipped。
        # 3-field regex のみを受け入れる。
        # 昇格の起源: context-kit#12 / self-growth-loop#4 → オーナー決裁 2026-08-19。
        # 最後に一致した行を採用する (複数回出力されうるため、最終状態を正とする)。
        env:
          REQUIRE_RECONCILIATION: ${{ inputs.require_suite_reconciliation }}
          MAX_SKIP_PERCENT: ${{ inputs.max_skip_percent }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_SKIP_PERCENT" =~ ^[0-9]+$ ]]; then
            echo "::error::max_skip_percent must be a nonnegative integer; received '${MAX_SKIP_PERCENT}' — failing closed."
            exit 1
          fi
          LINE=$(grep -oE 'suites: declared=[0-9]+ executed=[0-9]+ skipped=[0-9]+' /tmp/test-output.log | tail -n 1 || true)
          if [ -z "$LINE" ]; then
            if [ "$REQUIRE_RECONCILIATION" = "true" ]; then
              echo "::error::suite reconciliation line ('suites: declared=N executed=M skipped=K') not found in make test output, and require_suite_reconciliation=true — failing closed."
              exit 1
            fi
            echo "::notice::suite reconciliation line not found — T-6 vocabulary not adopted by this repo yet; reconciliation explicitly skipped (not silently)."
            exit 0
          fi
          DECLARED=$(echo "$LINE" | grep -oE 'declared=[0-9]+' | grep -oE '[0-9]+')
          EXECUTED=$(echo "$LINE" | grep -oE 'executed=[0-9]+' | grep -oE '[0-9]+')
          SKIPPED=$(echo "$LINE" | grep -oE 'skipped=[0-9]+' | grep -oE '[0-9]+')
          if (( 10#$EXECUTED + 10#$SKIPPED != 10#$DECLARED )); then
            echo "::error::suite reconciliation mismatch: declared=${DECLARED} executed=${EXECUTED} skipped=${SKIPPED}; T-6 requires declared=executed+skipped — failing closed."
            exit 1
          fi
          if (( 10#$EXECUTED == 0 )); then
            echo "::error::suite reconciliation: executed=0 — zero executed suites cannot prove anything, failing closed."
            exit 1
          fi
          if (( 10#$DECLARED > 0 && 10#$SKIPPED * 100 > 10#$DECLARED * 10#$MAX_SKIP_PERCENT )); then
            echo "::error::suite reconciliation skip cap exceeded: declared=${DECLARED} executed=${EXECUTED} skipped=${SKIPPED} max_skip_percent=${MAX_SKIP_PERCENT} — failing closed."
            exit 1
          fi
          echo "suite reconciliation OK: declared=${DECLARED} executed=${EXECUTED} skipped=${SKIPPED} max_skip_percent=${MAX_SKIP_PERCENT}"

  # test と同一コマンドを macOS (Apple Silicon) でも走らせる。job 名を分けているのは
  # 既存の required checks 設定 (test / lint) を壊さないため。required に入れるかは各リポの owner 判断。
  test-macos:
    name: test-macos
    if: ${{ inputs.run_macos }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate node_version (only when node_version is set)
        # setup-node は空白だけの node-version を trim して「何も入れずに成功」する (v7.0.0 src/main.ts)。
        # その緑は #101 が塞ぎたい「runner 既定 Node で走る門番」そのものなので、ここで赤にする (FP-5)。
        # 受理形は数値 pin (例: 20 / 20.11 / 22.x) のみ — 'lts/*' 等の浮動指定は門番を再び浮かせるため不可。
        # 3 job に同じ2ステップが並ぶ (test / test-macos / lint) — 改訂時は3箇所すべてを揃えること。
        if: ${{ inputs.node_version != '' }}
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          TRIMMED=$(printf '%s' "$NODE_VERSION" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ]; then
            echo "::error::node_version is whitespace-only — setup-node would install nothing and the gate would silently run on the runner-default Node (fail-closed). Pass a literal like '20', or remove the input."
            exit 1
          fi
          if ! [[ "$TRIMMED" =~ ^[0-9]+(\.([0-9]+|x)){0,2}$ ]]; then
            echo "::error::node_version must be a numeric pin (e.g. '20', '20.11', '22.x'); received '${NODE_VERSION}'. Floating specs (lts/*, node, ranges, .nvmrc) are not accepted — they re-open the version drift this input exists to close."
            exit 1
          fi

      - name: Setup Node (only when node_version is set)
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          # この入力の役目は Node の pin だけ。setup-node v7 は package.json の packageManager を見て
          # 既定で npm cache を復元/保存する (package-manager-cache: true) — 門番の結果を宣言外の cache に
          # 依存させないため明示 off (Grok seat F3, 2026-09-04)。
          package-manager-cache: false

      - name: Pre-test setup (macOS, only when pre_test_setup_macos is set)
        if: ${{ inputs.pre_test_setup_macos != '' }}
        shell: bash
        env:
          PRE_TEST_SETUP: ${{ inputs.pre_test_setup_macos }}
        run: |
          set -euo pipefail
          # 空白だけの入力は「置いただけ」の緑になるため赤にする (macos_skip_reason と同じ扱い・FP-5)。
          if [ -z "$(printf '%s' "$PRE_TEST_SETUP" | tr -d '[:space:]')" ]; then
            echo "::error::pre_test_setup_macos is whitespace-only — a setup step that runs nothing must not pass silently (fail-closed). Remove the input or write the command."
            exit 1
          fi
          # 検証した値 (env) をそのまま実行する — run: へ二重に式展開しない (検証対象と実行対象を同一値に保つ・
          # ログ面への展開も避ける)。caller 自身の CI 定義 (Makefile の test ターゲット) と同じ信頼境界。
          # この入力に secrets を渡さないこと (reusable は secrets: を受けない設計・README 参照)。
          printf '%s\n' "$PRE_TEST_SETUP" > "$RUNNER_TEMP/pre-test-setup.sh"
          bash -euo pipefail "$RUNNER_TEMP/pre-test-setup.sh"

      - name: Run tests (macOS)
        run: |
          set -euo pipefail
          # CUSTOMIZE: test ジョブと同じコマンドに揃える (乖離したら片方のゲートが嘘になる)。
          if [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test
          else
            echo "::error::test command is not configured. Add a 'test:' target to this repo's Makefile (the gate runs 'make test') — an unconfigured gate must not pass (fail-closed by design)."
            exit 1
          fi

  # run_macos=false のときに走る代替ジョブ (ubuntu・cheap)。無言スキップを禁止する:
  # macos_skip_reason が空なら赤、あれば warning で明示してから緑にする。test-macos と
  # test-macos-skip は if: が構造的に補集合 (x / !x) なので、inputs.run_macos の値によらず
  # どちらか一方だけが必ず走る — 「両方 skipped」を型として作れない (FP-5)。
  test-macos-skip:
    name: test-macos-skip
    if: ${{ !inputs.run_macos }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - name: Require explicit skip reason
        env:
          SKIP_REASON: ${{ inputs.macos_skip_reason }}
        run: |
          set -euo pipefail
          TRIMMED_SKIP_REASON=$(printf '%s' "$SKIP_REASON" | tr -d '[:space:]')
          if [ -z "$TRIMMED_SKIP_REASON" ]; then
            echo "::error::run_macos is false but macos_skip_reason is empty or whitespace-only — skipping the macOS matrix silently or without a stated reason is forbidden (fail-closed)."
            exit 1
          fi
          echo "::warning::macOS matrix explicitly skipped by caller: ${SKIP_REASON}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require pull_request event
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::reusable gates must be called from a pull_request caller — this reusable's range logic depends on the PR event payload (fail-closed, FP-6). event was: ${{ github.event_name }}"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate node_version (only when node_version is set)
        # setup-node は空白だけの node-version を trim して「何も入れずに成功」する (v7.0.0 src/main.ts)。
        # その緑は #101 が塞ぎたい「runner 既定 Node で走る門番」そのものなので、ここで赤にする (FP-5)。
        # 受理形は数値 pin (例: 20 / 20.11 / 22.x) のみ — 'lts/*' 等の浮動指定は門番を再び浮かせるため不可。
        # 3 job に同じ2ステップが並ぶ (test / test-macos / lint) — 改訂時は3箇所すべてを揃えること。
        if: ${{ inputs.node_version != '' }}
        env:
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          TRIMMED=$(printf '%s' "$NODE_VERSION" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ]; then
            echo "::error::node_version is whitespace-only — setup-node would install nothing and the gate would silently run on the runner-default Node (fail-closed). Pass a literal like '20', or remove the input."
            exit 1
          fi
          if ! [[ "$TRIMMED" =~ ^[0-9]+(\.([0-9]+|x)){0,2}$ ]]; then
            echo "::error::node_version must be a numeric pin (e.g. '20', '20.11', '22.x'); received '${NODE_VERSION}'. Floating specs (lts/*, node, ranges, .nvmrc) are not accepted — they re-open the version drift this input exists to close."
            exit 1
          fi

      - name: Setup Node (only when node_version is set)
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          # この入力の役目は Node の pin だけ。setup-node v7 は package.json の packageManager を見て
          # 既定で npm cache を復元/保存する (package-manager-cache: true) — 門番の結果を宣言外の cache に
          # 依存させないため明示 off (Grok seat F3, 2026-09-04)。
          package-manager-cache: false

      - name: Run lint
        run: |
          set -euo pipefail
          # CUSTOMIZE: このリポの lint コマンドに差し替える (例: npm run lint / ruff check / swiftlint)。
          # 既定は Makefile の `lint` ターゲットを試み、無ければ「未設定」として赤で落ちる (fail-closed)。
          if [ -f Makefile ] && grep -qE '^lint:' Makefile; then
            make lint
          else
            echo "::error::lint command is not configured. Add a 'lint:' target to this repo's Makefile (the gate runs 'make lint') — an unconfigured gate must not pass (fail-closed by design)."
            exit 1
          fi
